<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>期货策略收益排序</title>
  <link rel="stylesheet" href="/front/css/style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">FUTURES RANKING</p>
        <h1>收益排序</h1>
        <p id="subtitle" class="subtitle">选择一个观察时点，查看此前五日保证金收益率排名。</p>
      </div>
      <div id="health" class="status">正在连接数据…</div>
    </header>

    <section class="control-panel">
      <label>策略<select id="strategy"></select></label>
      <label class="time-label">观察时点<input id="timestamp" type="datetime-local" step="3600"></label>
      <button id="prev" title="上一个时点">← 上一时点</button>
      <button id="next" title="下一个时点">下一时点 →</button>
      <label class="number-label">Top K<input id="topK" type="number" min="1" max="100" value="10"></label>
      <button id="refresh" class="primary">刷新排名</button>
    </section>

    <section id="notice" class="notice hidden"></section>
    <section class="summary-grid">
      <div class="metric"><span>观察时点</span><strong id="asOf">—</strong></div>
      <div class="metric"><span>可排名品种</span><strong id="total">—</strong></div>
      <div class="metric"><span id="bestLabel">榜首五日保证金收益率</span><strong id="best">—</strong></div>
      <div class="metric"><span>计算窗口</span><strong>前5个交易日</strong></div>
    </section>

    <section class="ranking-card">
      <div class="card-title"><div><p class="eyebrow">LIVE SNAPSHOT</p><h2 id="rankingTitle">策略收益排名</h2></div><span id="updated">—</span></div>
      <div id="bars" class="bars"></div>
      <div class="table-wrap"><table><thead><tr><th>排名</th><th>品种</th><th>策略合约</th><th id="startValueHeading">五日前一手保证金/价格</th><th>观察时点权益/价格</th><th>五日收益/价格涨跌</th><th id="returnRateHeading">五日保证金收益率/价格涨幅</th><th>五日前数据时间</th><th>观察数据时间</th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>

    <footer>策略榜按前五个交易日净盈亏÷五日前一手保证金排序；纯价格榜按同区间价格涨幅排序。保证金按WT8历史成交和持仓记录估算。</footer>
  </main>
  <script src="/front/js/app.js?v=20261014-margin-normalized-ranking"></script>
</body>
</html>
